[project]
name = "larksync"
version = "0.1.0"
description = "飞书电子表格 / 多维表格的拉取与按主键更新"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "platformdirs>=4",
]

[project.optional-dependencies]
gui = [
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
